    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 1rem;
      }
      .item {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 1rem;
        margin-bottom: 1rem;
      }
      .skeleton {
        display: inline-block;
        height: 1em;
        width: 5em;
        background: linear-gradient(90deg, #eee, #ddd, #eee);
        background-size: 200% 100%;
        animation: pulse 1.2s ease-in-out infinite;
        border-radius: 4px;
      }
      @keyframes pulse {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <item-view v-for="item in items" :key="item.id" :item="item" />
    </div>

    <script>
      Vue.component("item-view", {
        props: ["item"],
        template: `
        <div class="item" ref="item">
          <h3>{{ item.title }}</h3>
          <p>
            가격:
            <span v-if="loading"><span class="skeleton"></span></span>
            <span v-else>{{ livePrice.toLocaleString() }}원</span>
            <small v-if="!loading && livePrice !== item.basePrice">(실시간 가격)</small>
          </p>
        </div>
      `,
        data() {
          return {
            loading: false,
            livePrice: this.item.basePrice,
            observer: null,
          };
        },
        mounted() {
          this.observer = new IntersectionObserver(
            ([entry]) => {
              if (entry.isIntersecting && entry.intersectionRatio > 0) {
                this.observer.disconnect();
                this.fetchLivePrice();
              }
            },
            {
              root: null,
              rootMargin: "500px",
              threshold: 0.01,
            }
          );
          this.observer.observe(this.$refs.item);
        },
        methods: {
          fetchLivePrice() {
            this.loading = true;
            const delay = Math.random() * 3000 + 1000; // 1~7초 랜덤
            setTimeout(() => {
              this.livePrice =
                this.item.basePrice + Math.floor(Math.random() * 10000 - 5000); // ±5천 원 랜덤
              console.log(
                `실시간 가격 적용 완료 → ID: ${this.item.id}, Title: ${this.item.title}`
              );
              this.loading = false;
            }, delay);
          },
        },
      });
